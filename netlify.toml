[build]
  base = "client"
  command = "npm install && npm run build"
  publish = "dist"

# IMPORTANT: Update the URL below with your actual Render backend URL after deployment
# Example: https://your-app-name.onrender.com
[[redirects]]
  from = "/api/*"
  to = "https://email-marketing-app-l7mg.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
